name: Build and Push Docker Image

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/build_release.yml'
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/build_release.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tag name
        id: extract_tag
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push (PR)
        if: github.event_name == 'pull_request'
        run: |
          SHORT_SHA=${{ github.event.pull_request.head.sha }}
          echo "Short SHA: $SHORT_SHA"
          docker buildx build --platform linux/amd64,linux/arm64 -t phasehq/kubernetes-operator:${SHORT_SHA:0:7} . --push

      - name: Build and push (Main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t phasehq/kubernetes-operator:main . --push

      - name: Build and push (Release tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t phasehq/kubernetes-operator:${{ steps.extract_tag.outputs.tag }} -t phasehq/kubernetes-operator:latest . --push
