apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: phasesecrets.secrets.phase.dev
spec:
  group: secrets.phase.dev
  names:
    kind: PhaseSecret
    listKind: PhaseSecretList
    plural: phasesecrets
    singular: phasesecret
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          type: object
          description: PhaseSecret is the Schema for the phasesecrets API
          properties:
            apiVersion:
              description: APIVersion defines the versioned schema of this representation of an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object represents.
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: PhaseSecretSpec defines the desired state of PhaseSecret
              anyOf:
                - required:
                    - phaseApp
                - required:
                    - phaseAppId
              properties:
                phaseApp:
                  description: The Phase application to fetch secrets from.
                  type: string
                  minLength: 1
                phaseAppId:
                  description: The Phase application ID to fetch secrets from. Takes precedence over phaseApp when set.
                  type: string
                  minLength: 1
                phaseAppEnv:
                  description: The environment variable representing the app environment in Phase.
                  type: string
                  default: "production"
                phaseAppEnvPath:
                  description: Path within the Phase application environment to fetch secrets from.
                  type: string
                  default: "/"
                phaseAppEnvTag:
                  description: Tag for filtering secrets in the specified Phase app environment.
                  type: string
                onSecretReferenceError:
                  description: >-
                    Policy when a Phase secret reference cannot be resolved. "Fail" (default)
                    aborts the sync so unresolved values are never written to the managed
                    Secret. "Warn" syncs anyway — leaving references as their literal ${...}
                    text — and records a Warning event naming the affected secrets.
                  type: string
                  enum:
                    - Fail
                    - Warn
                  default: Fail
                authentication:
                  type: object
                  properties:
                    serviceToken:
                      type: object
                      required:
                        - serviceTokenSecretReference
                      properties:
                        serviceTokenSecretReference:
                          type: object
                          required:
                            - secretName
                          properties:
                            secretName:
                              description: The name of the Kubernetes Secret.
                              type: string
                            secretNamespace:
                              description: The namespace where the Kubernetes Secret is located.
                              type: string
                phaseHost:
                  description: Phase host to pull secrets from.
                  type: string
                  default: "https://console.phase.dev"
                managedSecretReferences:
                  description: References to multiple managed Kubernetes Secrets.
                  type: array
                  items:
                    type: object
                    required:
                      - secretName
                    properties:
                      secretName:
                        description: The name of the Kubernetes Secret.
                        type: string
                      secretNamespace:
                        description: The namespace where the Kubernetes Secret is located.
                        type: string
                      secretType:
                        description: The type of the Kubernetes Secret.
                        type: string
                        default: "Opaque"
                        enum:
                          - "Opaque"
                          - "kubernetes.io/tls"
                          - "kubernetes.io/service-account-token"
                          - "kubernetes.io/dockercfg"
                          - "kubernetes.io/dockerconfigjson"
                          - "kubernetes.io/basic-auth"
                          - "kubernetes.io/ssh-auth"
                          - "bootstrap.kubernetes.io/token"
                      nameTransformer:
                        description: Default name transformer applied to all secret keys. Per-key nameTransformer in processors takes precedence.
                        type: string
                        enum:
                          - "upper_snake"
                          - "camel"
                          - "upper-camel"
                          - "lower-snake"
                          - "tf-var"
                          - "lower-kebab"
                      processors:
                        description: Processors to transform the data during ingestion.
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            asName:
                              description: The mapped name of the field in the managed secret.
                              type: string
                            nameTransformer:
                              description: The format for transforming the secret key name.
                              type: string
                              enum:
                                - "upper_snake"
                                - "camel"
                                - "upper-camel"
                                - "lower-snake"
                                - "tf-var"
                                - "lower-kebab"
                            type:
                              description: The type of process to be performed.
                              type: string
                              enum:
                                - "plain"
                                - "base64"
                              default: "plain"
                      template:
                        description: Template metadata to apply to the managed Kubernetes Secret.
                        type: object
                        properties:
                          metadata:
                            type: object
                            properties:
                              labels:
                                type: object
                                additionalProperties:
                                  type: string
                              annotations:
                                type: object
                                additionalProperties:
                                  type: string
                pollingInterval:
                  description: Interval at which to poll for secret updates.
                  type: integer
                  default: 60
                  minimum: 5
                redeployLabelSelector:
                  description: Optional label selector used to narrow Deployment scans for auto-redeploy.
                  type: string
              required:
                - managedSecretReferences
            status:
              description: PhaseSecretStatus defines the observed state of PhaseSecret
              type: object
              properties:
                conditions:
                  description: Conditions representing the current state of the resource.
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        description: Last time the condition transitioned from one status to another.
                        type: string
                        format: date-time
                      message:
                        description: Human-readable message indicating details about the transition.
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        description: Generation that the condition was set based upon.
                        type: integer
                        minimum: 0
                      reason:
                        description: Programmatic identifier for the reason of the condition's last transition.
                        type: string
                        maxLength: 1024
                        minLength: 1
                      status:
                        description: Status of the condition.
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        description: Type of condition in CamelCase.
                        type: string
                        maxLength: 316
      served: true
      storage: true
      subresources:
        status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: []
  storedVersions: []
