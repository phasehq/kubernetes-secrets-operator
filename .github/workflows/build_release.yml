name: Operator CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'phase-kubernetes-operator/**'
      - '.github/workflows/build_release.yml'
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'phase-kubernetes-operator/**'
      - '.github/workflows/build_release.yml'
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module dependencies
        run: go mod verify

      - name: Build operator binary
        run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/manager

      - name: Run tests
        run: go test -race -count=1 ./...

  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint operator chart
        run: helm lint phase-kubernetes-operator/

      - name: Render operator chart
        run: helm template phase-kubernetes-operator phase-kubernetes-operator/ > /dev/null

  build-and-push:
    needs: [test, helm-test]
    runs-on: ubuntu-latest
    env:
      STAGING_IMAGE: phasehq/kubernetes-operator-staging
      PRODUCTION_IMAGE: phasehq/kubernetes-operator
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tag name
        id: extract_tag
        if: github.event_name == 'release'
        shell: bash
        run: echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push staging image (PR)
        if: github.event_name == 'pull_request'
        run: |
          SHORT_SHA=${{ github.event.pull_request.head.sha }}
          echo "Short SHA: $SHORT_SHA"
          docker buildx build --platform linux/amd64,linux/arm64 -t ${STAGING_IMAGE}:${SHORT_SHA:0:7} . --push

      - name: Build and push staging image (Main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker buildx build --platform linux/amd64,linux/arm64 -t ${STAGING_IMAGE}:${SHORT_SHA} . --push

      - name: Build and push production image (Release tag)
        if: github.event_name == 'release'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t ${PRODUCTION_IMAGE}:${{ steps.extract_tag.outputs.tag }} -t ${PRODUCTION_IMAGE}:latest . --push
