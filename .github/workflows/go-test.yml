name: Operator Unit Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module dependencies
        run: go mod verify

      - name: Build operator binary
        run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/manager

      - name: Run tests
        run: go test -race -count=1 ./...
