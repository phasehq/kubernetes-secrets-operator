name: Operator Helm Chart Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'phase-kubernetes-operator/**'
      - '.github/workflows/operator-helm-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'phase-kubernetes-operator/**'
      - '.github/workflows/operator-helm-test.yml'

jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint operator chart
        run: helm lint phase-kubernetes-operator/

      - name: Render operator chart
        run: helm template phase-kubernetes-operator phase-kubernetes-operator/ > /dev/null
